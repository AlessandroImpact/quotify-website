<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Pagina non trovata — Quotify</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      :root {
        --primary-400: #60a5fa;
        --primary-600: #236CEF;
        --primary-50:  #eff6ff;
        --ink:         #0f172a;
        --muted:       #64748b;
        --line:        #e2e8f0;
        --bg:          #ffffff;
        --card:        #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f1f5f9; --muted: #94a3b8; --line: #1e293b;
          --bg: #020617; --card: #0f172a; --primary-50: #172554;
        }
      }
      html, body { margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        line-height: 1.6;
      }
      .wrap { width: 100%; max-width: 30rem; text-align: center; }
      .glow {
        position: fixed; top: 50%; left: 50%;
        width: min(38rem, 100vw); aspect-ratio: 1;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(35, 108, 239, 0.13), transparent 62%);
        pointer-events: none; z-index: 0;
      }
      .wrap > * { position: relative; z-index: 1; }
      .logo {
        display: inline-flex; align-items: center; gap: .5rem;
        font-weight: 700; font-size: 1.125rem; color: var(--ink);
        text-decoration: none; margin-bottom: 2.5rem;
      }
      .logo img { width: 2rem; height: 2rem; border-radius: .5rem; }
      .code {
        font-size: clamp(4rem, 18vw, 6.5rem); font-weight: 800;
        letter-spacing: -0.04em; line-height: 1; margin: 0;
        background: linear-gradient(135deg, var(--primary-600), var(--primary-400));
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      h1 { font-size: 1.375rem; font-weight: 700; margin: 1rem 0 .5rem; letter-spacing: -0.01em; }
      p { color: var(--muted); margin: 0 0 2rem; font-size: .9375rem; }
      .actions { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
      .btn {
        display: inline-flex; align-items: center; justify-content: center;
        padding: .75rem 1.5rem; border-radius: .625rem;
        font-size: .875rem; font-weight: 600; text-decoration: none;
        transition: transform .15s ease, box-shadow .15s ease, background-color .15s ease;
      }
      .btn:hover { transform: translateY(-1px); }
      .btn-primary {
        background: var(--primary-600); color: #fff;
        box-shadow: 0 4px 14px rgba(35, 108, 239, .3);
      }
      .btn-primary:hover { background: #1d4ed8; box-shadow: 0 6px 20px rgba(35, 108, 239, .38); }
      .btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
      .btn-ghost:hover { background: var(--primary-50); }
      .links {
        margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid var(--line);
        display: flex; flex-wrap: wrap; gap: 1.25rem; justify-content: center;
      }
      .links a { color: var(--muted); font-size: .8125rem; text-decoration: none; }
      .links a:hover { color: var(--primary-600); }
      @media (prefers-reduced-motion: reduce) { .btn { transition: none; } .btn:hover { transform: none; } }
    </style>
    <!-- Cloudflare Web Analytics — nessun cookie, dichiarato in cookie.html -->
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "79477fa210384cf8a3a70c2055e44b56"}'></script>
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>
    <main class="wrap">
      <a class="logo" href="/">
        <img src="/pwa-192x192.png" alt="" />
        Quotify
      </a>

      <p class="code" aria-hidden="true">404</p>
      <h1>Questa pagina non esiste</h1>
      <p>Il link potrebbe essere sbagliato o la pagina potrebbe essere stata spostata.</p>

      <div class="actions">
        <a class="btn btn-primary" href="/">Torna alla home</a>
        <a class="btn btn-ghost" href="https://app.quotify.it/">Vai all'app</a>
      </div>

      <nav class="links">
        <a href="/assistenza">Assistenza</a>
        <a href="/privacy">Privacy</a>
        <a href="/cookie">Cookie</a>
        <a href="/termini">Termini</a>
      </nav>
    </main>
  </body>
</html>
